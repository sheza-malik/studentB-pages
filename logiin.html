<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Login – Charmify</title>
    <style>
        body {
            font-family: Arial;
            background: #F9F5F0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .box {
            background: white;
            width: 380px;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 18px rgba(0,0,0,0.15);
        }

        h2 {
            text-align: center;
            margin-bottom: 18px;
        }

        input {
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            border: 1px solid #D0D0D0;
            border-radius: 8px;
            font-size: 15px;
        }

        input:focus {
            border-color: #E29578;
        }

        .btn {
            width: 100%;
            padding: 12px;
            background: #E29578;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
        }

        .btn:hover {
            background: #d47d63;
        }

        .social-btn {
            width: 100%;
            padding: 12px;
            border-radius: 8px;
            border: none;
            font-size: 16px;
            margin-top: 10px;
            cursor: pointer;
        }

        .google { background: #ffffff; border: 1px solid #D0D0D0; }
        .facebook { background: #1877F2; color: white; }
        .google:hover { background: #f0f0f0; }
        .facebook:hover { background: #0f5ec9; }

    </style>
</head>

<body>
    <div class="box">
        <h2>Welcome Back</h2>

        <!-- EMAIL -->
        <input type="email" placeholder="Email" required>

        <!-- PASSWORD -->
        <input type="password" placeholder="Password" required>

        <!-- LOGIN BUTTON -->
        <button class="btn">Login</button>

        <p style="text-align:center; margin: 10px 0;">or continue with</p>

        <!-- GOOGLE LOGIN -->
        <button class="social-btn google">Continue with Google</button>

        <!-- FACEBOOK LOGIN -->
        <button class="social-btn facebook">Continue with Facebook</button>
    </div>
</body>
</html>
